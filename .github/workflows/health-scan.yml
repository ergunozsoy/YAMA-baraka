name: Baraka Health Scan

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 06:00 UTC
  workflow_dispatch: {}    # elle tetikleme

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır (BEY)
        env:
          GITHUB_TOKEN: ${{ secrets.BARAKA_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m baraka.scan --registry registry.yaml

      - name: Raporu commit et (Yazmanlar)
        run: |
          git config user.name "baraka-bot"
          git config user.email "baraka-bot@users.noreply.github.com"
          git add reports/ archive/
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Yazmanlar: sağlık raporu $(date -u +%Y-%m-%d)"
            git push
          fi
